<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS 自動抓取測試</title>
    <style>
        .info { font-family: 'Segoe UI', Consolas, monospace; background: #202124; color: #e8eaed; padding: 20px; border-radius: 8px; line-height: 1.6; }
        .timer { color: #8ab4f8; font-weight: bold; border-top: 1px solid #3c4043; margin-top: 10px; padding-top: 10px; }
        .status { color: #f28b82; }
    </style>
</head>
<body>
    <div id="result" class="info">初始化中...</div>

    <script>
        // 高精度計時起始點
        const startTime = performance.now();

        (function initGPS() {
            const display = document.getElementById("result");
            display.innerText = "正在取得當下 GPS 位置 (High Accuracy)...";

            if (!navigator.geolocation) {
                display.innerHTML = '<span class="status">Error: 瀏覽器不支援 Geolocation</span>';
                return;
            }

            const options = {
                enableHighAccuracy: true, 
                timeout: 15000,           
                maximumAge: 0             
            };

            // 直接呼叫
            navigator.geolocation.getCurrentPosition(success, error, options);
        })();

        function success(position) {
            const duration = (performance.now() - startTime).toFixed(2);
            const { latitude, longitude, accuracy } = position.coords;
            
            document.getElementById("result").innerHTML = `
                <div>緯度: ${latitude}</div>
                <div>經度: ${longitude}</div>
                <div>精度: ±${accuracy.toFixed(1)} m</div>
                <div class="timer">頁面載入至抓取成功耗時: ${duration} ms</div>
            `;
        }

        function error(err) {
            const duration = (performance.now() - startTime).toFixed(2);
            let msg = "";
            switch (err.code) {
                case err.PERMISSION_DENIED:    msg = "使用者拒絕定位授權"; break;
                case err.POSITION_UNAVAILABLE: msg = "無法取得位置"; break;
                case err.TIMEOUT:              msg = "定位逾時"; break;
                default:                       msg = "未知錯誤"; break;
            }
            document.getElementById("result").innerHTML = `
                <div class="status">抓取失敗: ${msg}</div>
                <div class="timer">失敗耗時: ${duration} ms</div>
            `;
        }
    </script>
</body>
</html>
